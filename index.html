    hard: { label: '😈 排擠模式', desc: '困難・死掉從頭開始',       playerHp: 100, enemyHp: 1.2, enemyDmg: 1.0, spawn: 1.2,  bossHp: 1800, checkpoint: false, p1Kills: 30, p2Kills: 45 },

/* 網址參數：?gallery=1 素材預覽、?debug=1、?phase=2|3、?god=1
 *   ?touch=1 強制手機觸控介面（滑鼠當手指用，phone.html 模擬器使用）
 *   ?safe=上,右,下,左 模擬瀏海安全區（px） */
const PARAMS = (() => {
  const q = new URLSearchParams(location.search);
  const safe = (q.get('safe') || '').split(',').map(Number);
  return {
    gallery: q.get('gallery') === '1',
    debug: q.get('debug') === '1',
    phase: parseInt(q.get('phase') || '1', 10) || 1,
    god: q.get('god') === '1',
    touch: q.get('touch') === '1',
    safe: safe.length === 4 && safe.every(n => !isNaN(n)) ? safe : null,
  };
})();

/* =====================================================================
 * §1 Utils
 * ===================================================================== */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const Store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 無痕模式 */ } },
};
function mixHex(a, b, t) {
  const pa = parseInt(a.slice(1, 7), 16), pb = parseInt(b.slice(1, 7), 16);
  const ch = s => Math.round(((pa >> s) & 255) * (1 - t) + ((pb >> s) & 255) * t);
  return '#' + ((1 << 24) | (ch(16) << 16) | (ch(8) << 8) | ch(0)).toString(16).slice(1);
}
/* 由一個主色產生 5 階色帶 [輪廓, 暗, 中, 亮, 高光] */
function ramp(hex) {
  return [mixHex(hex, '#1a0c06', 0.6), mixHex(hex, '#2a1010', 0.3), hex, mixHex(hex, '#fff6d8', 0.28), mixHex(hex, '#fffbe8', 0.55)];
}
function makeCanvas(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  return c;
}

/* =====================================================================
 * §4 Sprites —— 程式化像素畫家（Painter）
 *   用圓、橢圓、多邊形、線條在低解析度格子上「畫」，最後自動描外框。
 *   所有角色與物件都是 2 倍放大顯示：32px 角色 = 64 世界單位 = 1 格地圖。
 *   變體：normal / flash(受傷白閃) / gray(時停灰階) 由像素後處理產生。
 * ===================================================================== */
const OUTLINE = '#2b1a12';        // 暖色深棕外框
const PIXEL = 2;                  // 遊戲中每個像素放大倍數

class Painter {
  constructor(w, h, ox = 0, oy = 0) { this.w = w; this.h = h; this.ox = ox; this.oy = oy; this.d = new Array(w * h).fill(null); }
  px(x, y, c) { x = Math.floor(x + this.ox); y = Math.floor(y + this.oy); if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.d[y * this.w + x] = c; }
  rect(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.px(x + i, y + j, c); }
  ellipse(cx, cy, rx, ry, c) {
    for (let y = Math.floor(cy - ry) - 1; y <= Math.ceil(cy + ry); y++)
      for (let x = Math.floor(cx - rx) - 1; x <= Math.ceil(cx + rx); x++) {
        const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
        if (dx * dx + dy * dy <= 1) this.px(x, y, c);
      }
  }
  circle(cx, cy, r, c) { this.ellipse(cx, cy, r, r, c); }
  /* 立體球：暗色底 → 主色略往左上 → 高光 */
  ball(cx, cy, rx, ry, dark, mid, light) {
    this.ellipse(cx, cy, rx, ry, dark);
    this.ellipse(cx - rx * 0.08, cy - ry * 0.1, rx * 0.9, ry * 0.86, mid);
    if (light) this.ellipse(cx - rx * 0.38, cy - ry * 0.42, rx * 0.34, ry * 0.26, light);
  }
  poly(pts, c) {
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    for (let y = Math.floor(Math.min(...ys)); y <= Math.ceil(Math.max(...ys)); y++)
      for (let x = Math.floor(Math.min(...xs)); x <= Math.ceil(Math.max(...xs)); x++) {
        const px = x + 0.5, py = y + 0.5; let inside = false;
        for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
          const [xi, yi] = pts[i], [xj, yj] = pts[j];
          if ((yi > py) !== (yj > py) && px < ((xj - xi) * (py - yi)) / (yj - yi) + xi) inside = !inside;
        }
        if (inside) this.px(x, y, c);
      }
  }
  line(x0, y0, x1, y1, c) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    for (;;) { this.px(x0, y0, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy) { err += dy; x0 += sx; } if (e2 <= dx) { err += dx; y0 += sy; } }
  }
  dots(list, c) { list.forEach(([x, y]) => this.px(x, y, c)); }

  /* ---------- 立體明暗（5 階色帶：[輪廓, 暗, 中, 亮, 高光]，光源在左上） ---------- */
  static shadeIdx(nx, ny, nz) {
    const v = -0.45 * nx - 0.55 * ny + 0.7 * nz;
    return v < 0.12 ? 1 : v < 0.52 ? 2 : v < 0.84 ? 3 : 4;
  }
  fillShaded(x0, y0, x1, y1, inside, normal, ramp, edge = true) {
    for (let y = Math.floor(y0) - 1; y <= Math.ceil(y1) + 1; y++)
      for (let x = Math.floor(x0) - 1; x <= Math.ceil(x1) + 1; x++) {
        const cx = x + 0.5, cy = y + 0.5;
        if (!inside(cx, cy)) continue;
        let col;
        if (edge && (!inside(cx - 1, cy) || !inside(cx + 1, cy) || !inside(cx, cy - 1) || !inside(cx, cy + 1))) col = ramp[0];
        else { const n = normal(cx, cy); col = ramp[Painter.shadeIdx(n[0], n[1], n[2])]; }
        this.px(x, y, col);
      }
  }
  ellipseS(cx, cy, rx, ry, ramp, edge = true) {
    this.fillShaded(cx - rx, cy - ry, cx + rx, cy + ry,
      (x, y) => ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 <= 1,
      (x, y) => { const nx = (x - cx) / rx, ny = (y - cy) / ry; return [nx, ny, Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny))]; },
      ramp, edge);
  }
  capsuleS(x0, y0, x1, y1, r, ramp, edge = true) {
    const dx = x1 - x0, dy = y1 - y0, L2 = dx * dx + dy * dy || 1;
    const near = (x, y) => { const t = clamp(((x - x0) * dx + (y - y0) * dy) / L2, 0, 1); return [x - (x0 + dx * t), y - (y0 + dy * t)]; };
    this.fillShaded(Math.min(x0, x1) - r, Math.min(y0, y1) - r, Math.max(x0, x1) + r, Math.max(y0, y1) + r,
      (x, y) => { const [a, b] = near(x, y); return a * a + b * b <= r * r; },
      (x, y) => { const [a, b] = near(x, y); const nx = a / r, ny = b / r; return [nx, ny, Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny))]; },
      ramp, edge);
  }
  rrectS(x, y, w, h, rad, ramp, edge = true) {
    const cx = x + w / 2, cy = y + h / 2;
    const inside = (px, py) => {
      const qx = Math.abs(px - cx) - (w / 2 - rad), qy = Math.abs(py - cy) - (h / 2 - rad);
      return (qx <= 0 && Math.abs(py - cy) <= h / 2) || (qy <= 0 && Math.abs(px - cx) <= w / 2) || (qx > 0 && qy > 0 && qx * qx + qy * qy <= rad * rad);
    };
    this.fillShaded(x, y, x + w, y + h, inside,
      (px, py) => { const nx = clamp((px - cx) / (w / 2), -1, 1) * 0.8, ny = clamp((py - cy) / (h / 2), -1, 1) * 0.8; return [nx, ny, Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny))]; },
      ramp, edge);
  }
  /* 多邊形：依每列左右邊界做「圓柱」明暗（適合斗篷、衣襬） */
  polyS(pts, ramp, edge = true) {
    const inPoly = (px, py) => {
      let inside = false;
      for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        const [xi, yi] = pts[i], [xj, yj] = pts[j];
        if ((yi > py) !== (yj > py) && px < ((xj - xi) * (py - yi)) / (yj - yi) + xi) inside = !inside;
      }
      return inside;
    };
    const span = py => {
      const xs = [];
      for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        const [xi, yi] = pts[i], [xj, yj] = pts[j];
        if ((yi > py) !== (yj > py)) xs.push(xi + ((py - yi) * (xj - xi)) / (yj - yi));
      }
      return xs.length ? [Math.min(...xs), Math.max(...xs)] : [0, 1];
    };
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    this.fillShaded(Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys), inPoly,
      (px, py) => { const [a, b] = span(py); const nx = clamp(((px - a) / (b - a || 1)) * 2 - 1, -1, 1) * 0.92; return [nx, -0.15, Math.sqrt(Math.max(0, 1 - nx * nx - 0.0225))]; },
      ramp, edge);
  }
  /* 自動外框（同色系加深，不用純黑）：透明像素若鄰接有色像素，就塗上鄰色的深色版 */
  outlineAuto(f = 0.5) {
    const s = this.d.slice(), w = this.w, h = this.h;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x; if (s[i] !== null) continue;
      const n = (x > 0 && s[i - 1]) || (x < w - 1 && s[i + 1]) || (y > 0 && s[i - w]) || (y < h - 1 && s[i + w]);
      if (n) this.d[i] = mixHex(n, '#1a0c06', f);
    }
  }
  /* 自動外框：透明像素若上下左右有顏色就塗上外框色 */
  outline(c = OUTLINE) {
    const s = this.d.slice(), w = this.w, h = this.h;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x; if (s[i] !== null) continue;
      if ((x > 0 && s[i - 1] !== null) || (x < w - 1 && s[i + 1] !== null) || (y > 0 && s[i - w] !== null) || (y < h - 1 && s[i + w] !== null)) this.d[i] = c;
    }
  }
  toCanvas() {
    const c = makeCanvas(this.w, this.h), x = c.getContext('2d');
    for (let i = 0; i < this.d.length; i++) if (this.d[i]) { x.fillStyle = this.d[i]; x.fillRect(i % this.w, (i / this.w) | 0, 1, 1); }
    return c;
  }
}
/* 舊式字串陣列 sprite（小圖示用） */
function rowsToCanvas(rows, pal) {
  const w = Math.max(...rows.map(r => r.length)), p = new Painter(w, rows.length);
  rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) if (r[x] !== '.' && pal[r[x]]) p.px(x, y, pal[r[x]]); });
  return p.toCanvas();
}

/* ---------- 變體後處理 ---------- */
function variantOf(base, variant) {
  const c = makeCanvas(base.width, base.height), x = c.getContext('2d');
  x.drawImage(base, 0, 0);
  const img = x.getImageData(0, 0, c.width, c.height), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] === 0) continue;
    if (variant === 'flash') { d[i] = d[i + 1] = d[i + 2] = 255; }
    else if (variant === 'gray') {
      const l = 0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2];
      d[i] = l * 0.82; d[i + 1] = l * 0.9; d[i + 2] = Math.min(255, l * 1.08 + 14);   // 時停：冷藍灰
    }
  }
  x.putImageData(img, 0, 0);
  return c;
}

const Sprites = {
  base: {}, cache: {},
  add(key, canvas) { this.base[key] = canvas; },
  get(key, variant = 'normal') {
    const b = this.base[key];
    if (!b) throw new Error('未定義的 sprite: ' + key);
    if (variant === 'normal') return b;
    const ck = key + '|' + variant;
    if (this.cache[ck]) return this.cache[ck];
    try { return (this.cache[ck] = variantOf(b, variant)); } catch (e) { return (this.cache[ck] = b); }   // file:// 開啟時圖片無法讀像素，就直接用原圖
  },
  draw(ctx, key, x, y, scale = PIXEL, variant = 'normal', flipX = false) {
    const img = this.get(key, variant), w = img.width * scale, h = img.height * scale;
    if (flipX) { ctx.save(); ctx.translate(Math.round(x + w), Math.round(y)); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0, w, h); ctx.restore(); }
    else ctx.drawImage(img, Math.round(x), Math.round(y), w, h);
  },
  size(key) { const b = this.base[key]; return { w: b.width, h: b.height }; },
};

/* 共用色帶（[輪廓, 暗, 中, 亮, 高光]） */
const R_GREEN = ['#1f5a1a', '#2f7d24', '#46a52f', '#62c23f', '#8ee05e'];
const R_SKIN = ['#8a5a3a', '#c88e66', '#e6b48a', '#f4cfa6', '#fde5c6'];
const R_BROWN = ['#3a2010', '#5a3418', '#7a4a22', '#9a6430', '#b8834a'];
const R_SILVER = ['#4a5260', '#7a8494', '#a8b2c0', '#ccd4de', '#eef2f6'];
const R_GOLD = ['#7a4a10', '#b07a1e', '#e0a830', '#f2c14e', '#fff0a0'];
const R_PACK = ['#2a3018', '#3e4a24', '#56663a', '#6e8048', '#8a9c5e'];

/* ---------- 天線寶寶家族 44×74：迪西（主角）＋ 巧馨召喚的丁丁、拉拉、小波 ---------- */
const TUBBIES = {
  dipsy: { ramp: R_GREEN, antenna: 'stick', angry: false },
  tinky: { ramp: ['#2e1450', '#4e2a86', '#7442b8', '#9466d6', '#b894ee'], antenna: 'triangle', angry: true },
  laa:   { ramp: ['#6a5010', '#a88a1c', '#e0c22e', '#f2dc58', '#fff09a'], antenna: 'curl', angry: true },
  po:    { ramp: ['#5a1010', '#9a2018', '#d23a28', '#ec6248', '#ff9a7a'], antenna: 'ring', angry: true },
};
function paintTubby(frame, kind) {
  const T = TUBBIES[kind], C = T.ramp, p = new Painter(46, 74, 0, 2);
  const lift = [[0, 0], [-2, 0], [0, -2]][frame];     // 走路：左/右腳抬起
  const swing = [0, 1.5, -1.5][frame];
  if (kind === 'dipsy') {
    // 背包（在身後，左肩露出）＋ 從背包探出頭的金色時鐘
    p.rrectS(3, 33, 12, 19, 4, R_PACK);
    p.ellipseS(8.5, 32.5, 4.2, 4.2, R_GOLD);
    p.circle(8.5, 32.5, 2.6, '#fff7e0'); p.rect(8, 30, 1, 3, '#e8213f'); p.rect(8, 32, 2, 1, '#3a2010');

/* ---------- 地圖 tile（32×32，2 倍放大 = 64 世界單位） ---------- */
const TILE_PX = 32;
function paintTile(kind, seed) {
  const p = new Painter(32, 32), rnd = mulberry32(seed * 7919 + kind.length * 131);
  const grass = (x, y) => { p.dots([[x, y], [x + 2, y], [x + 1, y - 1], [x + 1, y - 2]], '#6f9e34'); p.dots([[x + 1, y], [x + 1, y - 1]], '#8fc04a'); };
  if (kind === 'ground') {
    // 暖色沙土地（荒野競技場式淡淡棋盤格）
    p.rect(0, 0, 32, 32, seed % 2 ? '#e2b87c' : '#e9c48a');
    for (let k = 0; k < 5; k++) p.ellipse(rnd() * 32, rnd() * 32, 2 + rnd() * 3, 1 + rnd() * 1.5, seed % 2 ? '#dbb075' : '#e2bb80');
    const n = 1 + Math.floor(rnd() * 3);
    for (let k = 0; k < n; k++) { const x = Math.floor(rnd() * 29), y = Math.floor(rnd() * 30); p.rect(x, y, 2, 1, '#c08a52'); p.px(x, y - 1, '#f4d6a6'); }
    if (rnd() < 0.35) grass(2 + Math.floor(rnd() * 26), 4 + Math.floor(rnd() * 26));
  } else if (kind === 'wall' || kind === 'wall_top') {
    // 暖色石塊；wall = 正面可見（下方不是牆）
    const top = kind === 'wall' ? 24 : 32;
    p.rect(0, 0, 32, top, '#a07a5c');
    for (let y = 0; y < top; y += 8) {
      p.rect(0, y, 32, 1, '#7a5a42');
      const off = (y / 8) % 2 ? 8 : 0;
      for (let x = off; x < 32; x += 16) p.rect(x, y, 1, 8, '#7a5a42');
      for (let x = off; x < 32; x += 16) p.rect(x + 1, y + 1, 14, 1, '#bf9a78');
    }
    p.rect(0, 0, 32, 1, '#d4b08c');
    for (let k = 0; k < 4; k++) { const x = Math.floor(rnd() * 30), y = Math.floor(rnd() * (top - 2)); p.rect(x, y, 2, 1, '#6f9e34'); p.px(x + 1, y + 1, '#4f7a24'); }
    if (kind === 'wall') { p.rect(0, 24, 32, 8, '#5e4332'); p.rect(0, 24, 32, 1, '#3e2a1e'); p.rect(15, 25, 1, 7, '#3e2a1e'); p.rect(0, 31, 32, 1, '#2b1a12'); }
  } else if (kind === 'bush') {
    p.rect(0, 0, 32, 32, '#3f8a2e');
    for (let k = 0; k < 16; k++) {
      const x = rnd() * 32, y = rnd() * 32, r = 3 + rnd() * 2.5;
      p.circle(x, y + 1, r, '#2f6e24'); p.circle(x, y, r * 0.9, '#5ab03e'); p.px(x - r * 0.4, y - r * 0.5, '#9ee06a');
    }
  } else if (kind === 'spawn') {
    p.rect(0, 0, 32, 32, '#e2b87c');
    p.ellipse(16, 17, 12, 9, '#a89a8a'); p.ellipse(16, 16.4, 10.4, 7.4, '#7a5a3e'); p.ellipse(16, 17.2, 8.6, 5.8, '#3a2418');
    [[6, 12], [26, 12], [8, 23], [24, 23], [16, 8], [16, 26]].forEach(([x, y]) => { p.circle(x, y, 1.8, '#c9b49a'); p.px(x - 1, y - 1, '#ecdcc4'); });
  }
  return p.toCanvas();
}
function paintCrate(broken) {
  const p = new Painter(32, 32);
  p.ellipse(16, 29.5, 13, 2.5, '#c09060');   // 地面陰影
  p.rect(3, 5, 26, 24, '#8f5a2b');
  p.rect(4, 6, 24, 22, '#c98a4b');
  for (let y = 11; y < 28; y += 6) p.rect(4, y, 24, 1, '#a0682f');
  p.line(5, 26, 26, 7, '#a0682f'); p.line(5, 25, 25, 7, '#dba468');
  p.rect(4, 6, 24, 1, '#e8b070');
  [[4, 6], [26, 6], [4, 26], [26, 26]].forEach(([x, y]) => { p.rect(x, y, 2, 2, '#8a8a9a'); p.px(x, y, '#c8c8d8'); });
  // 派對緞帶 + 蝴蝶結
  p.rect(14, 5, 4, 24, '#ff4f8b'); p.rect(17, 5, 1, 24, '#c2306a');
  p.ellipse(12, 4, 3.4, 2.4, '#ff4f8b'); p.ellipse(20, 4, 3.4, 2.4, '#ff4f8b'); p.rect(14, 2, 4, 4, '#c2306a');
  p.px(11, 3, '#ffb0cc'); p.px(19, 3, '#ffb0cc');
  if (broken) {
    [[7, 9], [8, 10], [9, 10], [10, 11], [22, 18], [23, 19], [23, 20], [24, 21], [9, 21], [10, 22], [21, 9], [22, 10]].forEach(([x, y]) => p.px(x, y, OUTLINE));
    p.rect(19, 23, 6, 4, '#5a3418');
  }
  p.outline();
  return p.toCanvas();
}

const Tiles = {
  cache: {},
  get(kind, seed = 0, variant = 'normal') {
    const ck = `${kind}|${seed}`;
    const base = this.cache[ck] || (this.cache[ck] = paintTile(kind, seed));
    if (variant === 'normal') return base;
    const vk = ck + '|' + variant;
    return this.cache[vk] || (this.cache[vk] = variantOf(base, variant));
  },
};

/* 巧馨光環中心（sprite 像素座標）與光環倍率 */
const BOSS_CENTER = [32, 50], BOSS_AURA = 1.35;

/* ---------- 小型 3×5 像素數字字型（時鐘用） ---------- */
const DIGITS = {
  '0': ['111', '101', '101', '101', '111'], '1': ['010', '110', '010', '010', '111'],
  '2': ['111', '001', '111', '100', '111'], '3': ['111', '001', '111', '001', '111'],
  '4': ['101', '101', '111', '001', '001'], '5': ['111', '100', '111', '001', '111'],
  '6': ['111', '100', '111', '101', '111'], '7': ['111', '001', '010', '010', '010'],
  '8': ['111', '101', '111', '101', '111'], '9': ['111', '101', '111', '001', '111'],
  ':': ['0', '1', '0', '1', '0'],
  '/': ['001', '001', '010', '100', '100'],
};
const CLOCK_TXT = () => `${CONFIG.names.heroBday} 23:59:59`;
function drawPixelText(ctx, str, x, y, s, col) {
  ctx.fillStyle = col;
  let cx = x;
  for (const ch of str) {
    const g = DIGITS[ch];
    if (!g) { cx += 4 * s; continue; }
    for (let j = 0; j < 5; j++) for (let i = 0; i < g[j].length; i++) if (g[j][i] === '1') ctx.fillRect(cx + i * s, y + j * s, s, s);
    cx += (g[0].length + 1) * s;
  }
  return cx - x - s;
}
function pixelTextWidth(str, s) { let w = 0; for (const ch of str) w += ((DIGITS[ch] ? DIGITS[ch][0].length : 3) + 1) * s; return w - s; }

/* =====================================================================
 * §5 Map —— 只寫左上象限 15×10，鏡像成 30×20（上下左右完全對稱）
 * ===================================================================== */
const MAP_QUADRANT = [
  '###############',
  '#S...........S.',
  '#..BB....C.....',
  '#..BB..###.....',
  '#......#....C..',
  '#..C......BBB..',
  '#..C......BBB..',
  '#....##........',
  '#....##....C...',
  '#S.............',
];
const MAP_W = 30, MAP_H = 20, TILE = 64;
function buildMapRows() {
  const rows = [];
  for (let r = 0; r < MAP_H; r++) {
    let s = '';
    for (let c = 0; c < MAP_W; c++) s += MAP_QUADRANT[r < 10 ? r : MAP_H - 1 - r][c < 15 ? c : MAP_W - 1 - c];
    rows.push(s);
  }
  return rows;
}
/* 繪製整張地圖（tilePx = 每格畫幾個螢幕像素） */
function renderMap(ctx, rows, tilePx, variant = 'normal') {
  const sc = tilePx / TILE_PX;
  for (let r = 0; r < rows.length; r++) {
    for (let c = 0; c < rows[r].length; c++) {
      const ch = rows[r][c], x = c * tilePx, y = r * tilePx;
      const seed = r * 31 + c;
      ctx.drawImage(Tiles.get('ground', (seed % 8) * 2 + ((r + c) % 2), variant), x, y, tilePx, tilePx);
      // 牆、木箱在下方地面投下陰影
      const above = r > 0 ? rows[r - 1][c] : '';
      if (ch !== '#' && (above === '#' || above === 'C')) { ctx.fillStyle = 'rgba(80,40,10,0.28)'; ctx.fillRect(x, y, tilePx, Math.round(tilePx * 0.28)); }
      if (ch === '#') {
        const below = r + 1 < rows.length && rows[r + 1][c] === '#';
        ctx.drawImage(Tiles.get(below ? 'wall_top' : 'wall', seed % 5, variant), x, y, tilePx, tilePx);
      } else if (ch === 'C') Sprites.draw(ctx, 'crate', x, y, sc, variant);
      else if (ch === 'B') ctx.drawImage(Tiles.get('bush', seed, variant), x, y, tilePx, tilePx);
      else if (ch === 'S') ctx.drawImage(Tiles.get('spawn', 0, variant), x, y, tilePx, tilePx);
    }
  }
}

/* =====================================================================
 * UI 元件（HUD 與虛擬按鈕）——之後的 §10 Render 共用
 * ===================================================================== */
const UI = {
  font(px, bold = true) { return `${bold ? '900 ' : ''}${px}px "PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif`; },
  hpBar(ctx, x, y, w, h, ratio, label) {
    ctx.fillStyle = OUTLINE; ctx.fillRect(x - 3, y - 3, w + 6, h + 6);
    ctx.fillStyle = '#5a2a1a'; ctx.fillRect(x, y, w, h);
    const fw = Math.round(w * clamp(ratio, 0, 1));
    ctx.fillStyle = ratio > 0.5 ? '#5cc83a' : ratio > 0.25 ? '#ffc23a' : '#ff4a3a';
    ctx.fillRect(x, y, fw, h);
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(x, y, fw, Math.max(2, h / 4));
    if (label) { ctx.font = UI.font(Math.round(h * 0.8)); ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.fillText(label, x + 6, y + h / 2 + 1); }
  },
  ammo(ctx, x, y, n, max, reload) {
    const w = 22, h = 10, gap = 4;
    for (let i = 0; i < max; i++) {
      const bx = x + i * (w + gap);
      ctx.fillStyle = OUTLINE; ctx.fillRect(bx - 2, y - 2, w + 4, h + 4);
      ctx.fillStyle = '#5a3a24'; ctx.fillRect(bx, y, w, h);
      if (i < n) { ctx.fillStyle = '#ff9a3c'; ctx.fillRect(bx, y, w, h); ctx.fillStyle = '#ffd08a'; ctx.fillRect(bx, y, w, 3); }
      else if (i === n) { ctx.fillStyle = '#b06a2a'; ctx.fillRect(bx, y, Math.round(w * reload), h); }
    }
  },
  bossBar(ctx, x, y, w, ratio, name) {
    ctx.font = UI.font(14); ctx.textBaseline = 'bottom'; ctx.lineJoin = 'round';
    ctx.lineWidth = 4; ctx.strokeStyle = OUTLINE; ctx.strokeText(name, x, y - 5);
    ctx.fillStyle = '#ffd23f'; ctx.fillText(name, x, y - 5);
    ctx.fillStyle = OUTLINE; ctx.fillRect(x - 3, y - 3, w + 6, 18);
    ctx.fillStyle = '#4a1418'; ctx.fillRect(x, y, w, 12);
    ctx.fillStyle = '#e8402a'; ctx.fillRect(x, y, Math.round(w * ratio), 12);
    ctx.fillStyle = 'rgba(255,230,150,0.35)'; ctx.fillRect(x, y, Math.round(w * ratio), 3);
    ctx.fillStyle = OUTLINE; for (let k = 1; k < 3; k++) ctx.fillRect(x + Math.round(w * k / 3) - 1, y, 2, 12); // 三階段刻度
  },
  ultRing(ctx, cx, cy, r, ratio, t) {
    const full = ratio >= 1;
    if (full) { ctx.fillStyle = `rgba(255,210,63,${0.25 + 0.2 * Math.sin(t * 8)})`; ctx.beginPath(); ctx.arc(cx, cy, r + 8, 0, Math.PI * 2); ctx.fill(); }
    ctx.lineWidth = 8; ctx.strokeStyle = OUTLINE; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 5; ctx.strokeStyle = '#5a3a24'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = full ? '#ffd23f' : '#7fd0ff';
    ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp(ratio, 0, 1)); ctx.stroke();
    const s = Math.max(2, Math.floor(r / 8)), sz = Sprites.size('clockIcon');
    Sprites.draw(ctx, 'clockIcon', cx - (sz.w * s) / 2, cy - (sz.h * s) / 2, s);
  },
  frozenClock(ctx, x, y, s, t, text = CLOCK_TXT()) {
    // 文字可帶日期，例如「11/28 23:59:59」：日期不閃爍（琥珀色），時間閃爍（紅色）
    const tw = pixelTextWidth(text, s), pad = s * 2;
    ctx.fillStyle = OUTLINE; ctx.fillRect(x - pad - s, y - pad - s, tw + pad * 2 + s * 2, 5 * s + pad * 2 + s * 2);
    ctx.fillStyle = '#2a0f0a'; ctx.fillRect(x - pad, y - pad, tw + pad * 2, 5 * s + pad * 2);
    const blink = Math.floor(t * 2) % 2 === 0, sp = text.lastIndexOf(' ');
    const date = sp >= 0 ? text.slice(0, sp + 1) : '', time = text.slice(sp + 1), tx = x + (date ? pixelTextWidth(date, s) + s : 0);
    if (date) drawPixelText(ctx, date, x, y, s, '#ffb03a');
    drawPixelText(ctx, '88:88:88', tx, y, s, '#3a1810');
    drawPixelText(ctx, time, tx, y, s, blink ? '#ff4a3a' : '#9c2a20');
    return tw + pad * 2;
  },
  joystick(ctx, cx, cy, r, kx, ky) {
    ctx.fillStyle = 'rgba(43,26,18,0.45)'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.stroke();
    const kr = r * 0.45;
    ctx.fillStyle = OUTLINE; ctx.beginPath(); ctx.arc(cx + kx * r, cy + ky * r + 3, kr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff9a3c'; ctx.beginPath(); ctx.arc(cx + kx * r, cy + ky * r, kr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd08a'; ctx.fillRect(cx + kx * r - kr * 0.4, cy + ky * r - kr * 0.6, kr * 0.5, kr * 0.3);
  },
  button(ctx, cx, cy, r, icon, label, opts = {}) {
    const { glow = false, pressed = false, t = 0, color = '#ff6a3c', disabled = false } = opts;
    if (glow) { ctx.fillStyle = `rgba(255,210,63,${0.3 + 0.25 * Math.sin(t * 8)})`; ctx.beginPath(); ctx.arc(cx, cy, r + 10, 0, Math.PI * 2); ctx.fill(); }
    const dy = pressed ? 3 : 0;
    ctx.fillStyle = OUTLINE; ctx.beginPath(); ctx.arc(cx, cy + 4, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = disabled ? '#7a6a5a' : color; ctx.beginPath(); ctx.arc(cx, cy + dy, r, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = OUTLINE; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.beginPath(); ctx.arc(cx - r * 0.3, cy + dy - r * 0.35, r * 0.25, 0, Math.PI * 2); ctx.fill();
    if (icon) {
      const sz = Sprites.size(icon), s = Math.max(1, Math.floor((r * 1.25) / sz.w * 2) / 2);
      Sprites.draw(ctx, icon, cx - (sz.w * s) / 2, cy + dy - (sz.h * s) / 2 - (label ? 4 : 0), s, disabled ? 'gray' : 'normal');
    }
    if (label) {
      ctx.font = UI.font(11); ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillStyle = OUTLINE; ctx.fillText(label, cx + 1, cy + dy + r * 0.45 + 1);
      ctx.fillStyle = '#fff'; ctx.fillText(label, cx, cy + dy + r * 0.45);
      ctx.textAlign = 'left';
    }
  },
  bubble(ctx, text, cx, by, px = 12) {
    ctx.font = UI.font(px);
    const w = Math.ceil(ctx.measureText(text).width) + 10, h = px + 8, x = Math.round(cx - w / 2), y = Math.round(by - h - 6);
    ctx.fillStyle = OUTLINE; ctx.fillRect(x - 2, y - 2, w + 4, h + 4); ctx.fillRect(cx - 4, y + h, 8, 6);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, w, h); ctx.fillRect(cx - 2, y + h, 4, 4);
    ctx.fillStyle = '#d8301f'; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
    ctx.fillText(text, cx, y + h / 2 + 1); ctx.textAlign = 'left';
  },
};

/* ---------- 特效小工具 ---------- */
const CONFETTI = ['#ff4f8b', '#ffd23f', '#6ec6ff', '#7ee06a', '#ff9a3c', '#c58bff'];
const FX = {
  streamer(ctx, x, y, ang, t, idx, s = 4) {
    for (let k = 3; k >= 0; k--) {           // 拖尾
      const tx = x - Math.cos(ang) * k * s * 2.2, ty = y - Math.sin(ang) * k * s * 2.2;
      ctx.globalAlpha = k === 0 ? 1 : 0.5 - k * 0.12;
      ctx.save(); ctx.translate(tx, ty); ctx.rotate(t * 12 + idx + k);
      ctx.fillStyle = CONFETTI[(idx + k) % CONFETTI.length];
      ctx.fillRect(-s, -s / 2, s * 2, s); ctx.restore();
    }
    ctx.globalAlpha = 1;
  },
  warnCircle(ctx, cx, cy, r, progress) {
    ctx.fillStyle = 'rgba(60,30,10,0.3)'; ctx.beginPath(); ctx.ellipse(cx, cy, r, r * 0.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(230,50,30,0.4)'; ctx.beginPath(); ctx.ellipse(cx, cy, r * progress, r * 0.6 * progress, 0, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#d8301f'; ctx.setLineDash([8, 6]);
    ctx.beginPath(); ctx.ellipse(cx, cy, r, r * 0.6, 0, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  },
  dashLine(ctx, x1, y1, x2, y2, t) {
    ctx.lineWidth = 10; ctx.strokeStyle = `rgba(230,40,30,${0.3 + 0.3 * Math.sin(t * 20)})`;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  },
  /* 爆氣怒氣符號（四角紅色青筋） */
  angerMark(ctx, cx, cy, s, t) {
    const a = s * (1 + 0.15 * Math.sin(t * 10));
    ctx.fillStyle = '#ff2a2a';
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([dx, dy]) => {
      ctx.fillRect(cx + dx * a * 1.3 - a / 2, cy + dy * a * 1.3 - a * 0.9, a, a * 1.8);
      ctx.fillRect(cx + dx * a * 1.3 - a * 0.9, cy + dy * a * 1.3 - a / 2, a * 1.8, a);
    });
  },
  /* 巧馨的天地日月精華光環。layer='back' 畫在角色後面，'front' 畫在前面（日月繞行的前半圈） */
  bossAura(ctx, cx, cy, s, t, rage, layer) {
    const R = 34 * s;

  for (let ty = t0y; ty <= t1y; ty++) for (let tx = t0x; tx <= t1x; tx++)
    if (Arena.type(tx, ty) === T_CRATE && Math.hypot((tx + 0.5) * TILE - x, (ty + 0.5) * TILE - y) < r + 20 && Arena.hitCrate(tx, ty, 40)) crateBroken(tx, ty);

function fireLaser(x, y, ang, w) {

  const segHit = (px, py, rr) => { const t = clamp(((px - x) * cx + (py - y) * cy), 0, d); const qx = x + cx * t, qy = y + cy * t; return Math.hypot(px - qx, py - qy) < rr; };
  for (const e of W.enemies) if (e.alive && e.spawnT <= 0 && segHit(e.x, e.y - 10, e.r + 12)) damageEnemy(e, w.dmg, null, x, y);
  const b = W.boss; if (b && b.active && segHit(b.x, b.y, b.r + 10)) damageBoss(w.dmg);
  W.beams.push({ x0: x, y0: y, x1: ex, y1: ey, t: 0, alive: true });

}
function bulletHitsTile(b, tx, ty, px, py) {

  } else if (b.kind !== 'flame') burst(b.x, b.y, 4, { cols: ['#fff3b0', '#ffffff', b.color || '#ffd23f'], size: 4, grav: 0, life: 0.25, speed: 160 });

}
function updateBullets(dt, ts) {
  const near = [];
  let eb = 0;

    const dist = b.speed * bdt, n = Math.max(1, Math.ceil(dist / 12));

    for (let k = 0; k < n && b.alive; k++) {
      const px = b.x, py = b.y;
      b.x += b.vx * bdt / n; b.y += b.vy * bdt / n;
      const tx = Math.floor(b.x / TILE), ty = Math.floor(b.y / TILE);
      if (Arena.solid(tx, ty)) { if (bulletHitsTile(b, tx, ty, px, py)) break; continue; }
      if (b.team === 'player') {

        for (const e of near) {
          if (!e.alive || e.spawnT > 0 || (e.x - b.x) ** 2 + (e.y - 10 - b.y) ** 2 >= (e.r + b.r) ** 2) continue;
          if (b.hits && b.hits.includes(e)) continue;
          if (b.kind === 'rocket') { b.alive = false; damageEnemy(e, b.dmg, b); explode(b.x, b.y, b.blast, b.blastDmg); break; }
          damageEnemy(e, b.dmg, b);

        }

          damageBoss(b.dmg);
          if (b.kind === 'rocket') { b.alive = false; explode(b.x, b.y, b.blast, b.blastDmg); }
          else if (b.pierce > 0) { b.pierce--; b.hitBoss = true; } else b.alive = false;
          if (!b.alive) burst(b.x, b.y, 3, { cols: ['#fff3b0', b.color || '#ffd23f'], size: 4, grav: 0, life: 0.2, speed: 140 });
        }
      } else if (!P.dead && (P.x - b.x) ** 2 + (P.y - 16 - b.y) ** 2 < (P.r + b.r - 2) ** 2) { hurtPlayer(b.dmg); b.alive = false; }
    }

  for (const o of W.beams) { o.t += dt; if (o.t > 0.22) o.alive = false; } compact(W.beams);
  for (const o of W.flashes) { o.t += dt; if (o.t > 0.07) o.alive = false; } compact(W.flashes);

}

/* ---------- 玩家 ---------- */

}
function muzzlePos(ang) { const g = 1 + 0.6 * P.grow; return [P.x + P.face * 6 * g + Math.cos(ang) * 40 * g, P.y - 30 * g + Math.sin(ang) * 40 * g]; }
function tryFire(ang) {
  if (P.fireCd > 0) return false;

  if (isPistol && P.ammo < 1) { Snd.play('empty'); P.fireCd = 0.15; return false; }
  if (ang === null || ang === undefined) ang = P.face > 0 ? 0 : Math.PI;
  P.fireCd = w.cd * (P.speedT > 0 ? 0.7 : 1); P.reveal = 1.2; P.recoil = 1;
  const dmgMul = P.giantT > 0 ? 1.8 : 1;

  if (w.kind === 'laser') fireLaser(mx, my, ang, dmgMul > 1 ? Object.assign({}, w, { dmg: w.dmg * dmgMul }) : w);
  else for (let i = 0; i < w.n; i++) {
    const off = w.n > 1 ? (i - (w.n - 1) / 2) * w.spread : 0, j = w.jitter ? (Math.random() - 0.5) * w.jitter : 0;
    shoot('player', mx, my, ang + off + j, { speed: w.speed * (w.kind === 'flame' ? 0.8 + Math.random() * 0.4 : 1), range: w.range, dmg: w.dmg * dmgMul, r: w.r * (dmgMul > 1 ? 1.3 : 1),
      kind: w.kind, pierce: w.pierce, knock: w.knock, blast: w.blast, blastDmg: w.blastDmg && w.blastDmg * dmgMul, color: w.color });
  }

  burst(mx, my, w.kind === 'flame' ? 1 : 4, { ang, cone: 0.8, size: 4, speed: 200, life: 0.25, grav: 0, cols: w.kind === 'confetti' ? CONFETTI : [w.color, '#fff3b0'] });
  if (w.kind === 'rocket' || w.kind === 'shotgun') W.shake = Math.max(W.shake, 5);
  if (isPistol) P.ammo--;
  else if (--P.special.ammo <= 0) {

    P.special = null; P.cur = 'pistol';
  }

  return true;
}
function autoAim() {
  const range = curWeapon().range + 140;

  const consider = (x, y) => { const d = Math.hypot(x - P.x, y - P.y); if (d > range) return; const s = d + (Arena.los(P.x, P.y - 20, x, y) ? 0 : 500); if (s < bs) { bs = s; best = [x, y]; } };
  for (const e of W.enemies) if (e.alive && e.spawnT <= 0) consider(e.x, e.y - 14);
  if (W.boss && W.boss.active) consider(W.boss.x, W.boss.y);

}
function swapWeapon() {

}
function updatePlayer(dt) {

  P.speedT = Math.max(0, P.speedT - dt); P.giantT = Math.max(0, P.giantT - dt);
  P.grow = clamp(P.grow + (P.giantT > 0 ? dt : -dt) * 4, 0, 1); P.r = 18 + 12 * P.grow;

  const spd = P.speed * (P.speedT > 0 ? 1.7 : 1);
  if (P.moving && P.speedT > 0 && Math.random() < 0.5) burst(P.x, P.y - 20, 1, { cols: ['#3fb8ff', '#b8ecff'], size: 7, speed: 20, life: 0.3, grav: 0, round: true });
  if (P.moving) { moveCircle(P, m.x * spd * dt, m.y * spd * dt); P.walkT += dt; if (Math.abs(m.x) > 0.2) P.face = m.x > 0 ? 1 : -1; }
  P.hidden = Arena.bushAt(P.x, P.y) && P.reveal <= 0;
  if (P.ammo < 3) { P.reload += dt / 0.7; if (P.reload >= 1) { P.ammo++; P.reload = 0; } }
  if (Input.swapTap) { Input.swapTap = false; if (canAct()) swapWeapon(); }

    if (Input.touch && Input.fire) {

}

/* ---------- 敵人 ---------- */
function spawnEnemy(type, x, y) {

  if (b) { e.kx += b.vx / b.speed * b.knock * kb; e.ky += b.vy / b.speed * b.knock * kb; }
  else if (ox !== undefined) { const a = Math.atan2(e.y - oy, e.x - ox); e.kx += Math.cos(a) * 320 * kb; e.ky += Math.sin(a) * 320 * kb; }
  if (dmg >= 20) floatText(e.x, e.y - 60, String(Math.round(dmg)), '#ffd23f', 15);
  Snd.play('hit');
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e, quiet) {
  e.alive = false; W.kills++;
  if (!quiet && (W.stage === 'p1' || W.stage === 'p2')) W.stageKills++;
  burst(e.x, e.y - 20, quiet ? 8 : e.d.tubby ? 30 : 14, { up: 100 });
  if (quiet) return;
  Snd.play('enemyDie');
  if (e.d.tubby) floatText(e.x, e.y - 90, `${e.d.name} 被打倒了！`, '#ffd23f', 18);
  if (W.kills % 35 === 0) cutin(pick(CONFIG.cutins.kills));
  const d = e.d;
  if (Math.random() < d.pWeapon) addDrop('weapon', e.x, e.y, pickWeapon());
  if (Math.random() < d.pCash) dropCash(e.x, e.y, d.cash);
  if (Math.random() < d.pHeart) addDrop('heart', e.x + 14, e.y + 8, 25);
}
function steer(e, t) {
  let tx = t.x, ty = t.y;
  if (!Arena.los(e.x, e.y, tx, ty)) { const f = Arena.flowTarget(e.x, e.y); if (f) { tx = f.x; ty = f.y; } }
  const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy);
  return d < 6 ? [0, 0] : [dx / d, dy / d];
}
function updateEnemies(edt, dt) {
  const near = [];
  let bubbles = 0;
  for (const e of W.enemies) if (e.bubble) bubbles++;
  for (const e of W.enemies) {
    if (!e.alive) continue;
    e.flash -= dt;
    if (edt <= 0) continue;
    e.spawnT -= edt; e.hitCd -= edt; e.st -= edt;
    const d = e.d, dx = P.x - e.x, dy = P.y - e.y, dist = Math.hypot(dx, dy) || 1;
    const sees = !P.dead && (!P.hidden || dist < 110);
    const tgt = sees ? P : W.lastKnown;
    let vx = 0, vy = 0, speed = d.speed;
    e.cd = (e.cd || 0) - edt;
    if (e.spawnT > 0) { /* 剛從洞裡冒出來 */ }
    else if (e.type === 'charger' || e.type === 'po') {
      // 暴走群主／小波：預警後直線衝撞
      const po = e.type === 'po';
      if (e.state === 'chase') {
        [vx, vy] = steer(e, tgt);
        if (sees && e.cd <= 0 && dist < (po ? 440 : 380) && Arena.los(e.x, e.y, P.x, P.y)) { e.state = 'windup'; e.st = po ? 0.45 : 0.6; e.dir = [dx / dist, dy / dist]; Snd.play('dashWarn'); }
      } else if (e.state === 'windup') { if (e.st <= 0) { e.state = 'dash'; e.st = po ? 0.45 : 0.5; } }
      else if (e.state === 'dash') { vx = e.dir[0]; vy = e.dir[1]; speed = po ? 720 : 650; if (e.st <= 0) { e.state = 'rest'; e.st = 0.5; e.cd = po ? 1.4 : 0; } }
      else if (e.st <= 0) e.state = 'chase';
    } else if (e.type === 'tinky') {
      // 丁丁：靠近後蓄力跺地，震出一圈彈幕
      if (e.state === 'chase') {
        [vx, vy] = steer(e, tgt);
        if (sees && e.cd <= 0 && dist < 180) { e.state = 'stomp'; e.st = 0.6; Snd.play('cakeWarn'); }
      } else if (e.state === 'stomp') {
        if (e.st <= 0) {
          for (let i = 0; i < 12; i++) shoot('enemy', e.x, e.y - 10, i / 12 * Math.PI * 2, { speed: 240, dmg: 10, r: 9 });
          if (dist < 140) hurtPlayer(d.dmg);
          burst(e.x, e.y + 10, 18, { cols: ['#e2b87c', '#c08a52', '#9466d6'], size: 6, up: 60 });
          W.shake = Math.max(W.shake, 9); Snd.play('stomp');
          e.state = 'rest'; e.st = 0.6; e.cd = 2.6;
        }
      } else if (e.st <= 0) e.state = 'chase';
    } else if (e.type === 'shooter' || e.type === 'laa') {
      const laa = e.type === 'laa';
      if (sees && dist < 260) { vx = -dx / dist; vy = -dy / dist; }
      else if (!sees || dist > 340) [vx, vy] = steer(e, tgt);
      else { vx = -dy / dist * 0.5 * e.side; vy = dx / dist * 0.5 * e.side; }
      e.shootT -= edt;
      if (e.shootT <= 0 && sees && dist < 520 && Arena.los(e.x, e.y - 20, P.x, P.y - 16)) {
        const ang = Math.atan2(P.y - 16 - (e.y - 24), P.x - e.x);
        if (laa) { e.shootT = 1.8; shoot('enemy', e.x, e.y - 30, ang, { speed: 300, dmg: 12, r: 13, kind: 'ball', bounce: 2 }); Snd.play('throwBall'); }
        else { e.shootT = 2; shoot('enemy', e.x, e.y - 24, ang, { speed: 220, dmg: 8, r: 9 }); Snd.play('bossShot'); }
      }
    } else {
      [vx, vy] = steer(e, tgt);
      if (e.type === 'chaser' && (vx || vy)) {
        const z = Math.sin(e.walkT * 6 + e.zig) * 0.7; vx += -vy * z; vy += vx * z;
        const l = Math.hypot(vx, vy) || 1; vx /= l; vy /= l;
      }
    }
    // 分離力：避免疊成一團
    Grid.near(e.x, e.y, 60, near);
    let sx = 0, sy = 0;
    for (const o of near) {
      if (o === e || !o.alive) continue;
      const ox = e.x - o.x, oy = e.y - o.y, dd = Math.hypot(ox, oy), min = e.r + o.r;
      if (dd > 0 && dd < min) { sx += ox / dd * (min - dd) / min; sy += oy / dd * (min - dd) / min; }
    }
    const mvx = vx * speed + sx * 160 + e.kx, mvy = vy * speed + sy * 160 + e.ky;
    e.kx *= 0.85; e.ky *= 0.85;
    if (vx || vy) e.walkT += edt;
    const hit = moveCircle(e, mvx * edt, mvy * edt);
    if (hit && e.state === 'dash') { e.state = 'stun'; e.st = 0.8; W.shake = Math.max(W.shake, 5); burst(e.x, e.y, 8, { cols: ['#c9b49a', '#a07a5c'], size: 4 }); }
    if (Math.abs(mvx) > 5) e.face = mvx > 0 ? 1 : -1;
    if (!P.dead && e.spawnT <= 0 && e.hitCd <= 0 && dist < e.r + P.r + 4) {
      if (P.giantT > 0) { damageEnemy(e, 25, null, P.x, P.y); e.hitCd = 0.4; W.shake = Math.max(W.shake, 3); }   // 巨大化：撞到就把敵人撞飛
      else { hurtPlayer(e.state === 'dash' ? d.dmg * 1.5 : d.dmg); e.hitCd = 0.8; }
    }
    // 頭頂彈幕
    e.bubbleT -= edt;
    if (e.bubbleT <= 0) {
      if (e.bubble) { e.bubble = null; e.bubbleT = 3 + Math.random() * 5; bubbles--; }
      else if (bubbles < 6) { e.bubble = pick(d.tubby ? CONFIG.taunts.tubby : d.elite ? CONFIG.taunts.p2 : CONFIG.taunts.p1); e.bubbleT = 1.6; bubbles++; }
      else e.bubbleT = 1;
    }
  }
  compact(W.enemies);
}

/* =====================================================================
 * §8 Director —— 關卡時間軸與波次
 * ===================================================================== */
function pickSpawn() { const ok = Arena.spawns.filter(s => Math.hypot(s.x - P.x, s.y - P.y) >= 300); return ok.length ? pick(ok) : null; }
function spawnInterval() {
  const p2 = W.stage === 'p2', u = clamp(W.stageT / CONFIG.stageTime, 0, 1);
  return lerp(p2 ? 1.2 : 1.7, p2 ? 0.7 : 0.85, u) / W.diff.spawn;
}
function spawnWave() {
  const cap = W.diffKey === 'hard' ? 55 : 40;
  if (W.enemies.length >= cap) return;
  const sp = pickSpawn(); if (!sp) return;
  const p2 = W.stage === 'p2', t = W.stageT;
  const n = Math.min(cap - W.enemies.length, 1 + Math.floor(Math.random() * (p2 ? 3 : Math.min(3, 1 + t / 20))));
  for (let i = 0; i < n; i++) {
    let type = 'mob'; const r = Math.random();
    if (p2) type = r < 0.15 ? 'charger' : r < 0.4 ? 'chaser' : r < 0.5 ? 'shooter' : 'mob';
    else if (t > 30 && r < 0.25) type = 'shooter';
    spawnEnemy(type, sp.x + (Math.random() - 0.5) * 24, sp.y + (Math.random() - 0.5) * 24);
  }
}
function enterStage(s) {
  W.stage = s; W.stageT = 0; W.stageKills = 0;
  if (s === 'p2') { W.cutinIdx = Math.max(W.cutinIdx, CONFIG.cutins.timed.findIndex(c => c[0] > CONFIG.stageTime)); banner('精英群友上線！', 'Phase 2・小心衝撞的群主'); Snd.play('phase'); saveCheckpoint(); }
  else if (s === 'bossIntro') {
    for (const e of W.enemies) { killEnemy(e, true); floatText(e.x, e.y - 50, '已退出群組', '#fff', 14); }
    W.enemies.length = 0; clearEnemyBullets(); W.timeStop = 0;
    saveCheckpoint();
    W.boss = makeBoss(); Music.stop(); Snd.play('phase');
  } else if (s === 'boss') { W.boss.active = true; Music.play('boss'); }
  else if (s === 'bossDeath') { Music.stop(); }
  else if (s === 'victory') setupVictory();
}
function stageGoal() { return W.stage === 'p2' ? W.diff.p2Kills : W.diff.p1Kills; }
/* 劇情時間軸（插話用）：第一關 0–50、第二關 50–100，不受提早過關影響 */
function storyTime() { return W.stage === 'p2' ? CONFIG.stageTime + W.stageT : W.stageT; }
function updateDirector(dt, ts) {
  if (W.stage === 'p1' || W.stage === 'p2' || W.stage === 'boss') W.time += dt;
  if (P.dead) return;
  if (W.stage === 'p1' || W.stage === 'p2') {
    const goal = stageGoal(), byKills = W.stageKills >= goal;
    if (byKills || W.stageT >= CONFIG.stageTime) {
      if (byKills) { cutin(pick(CONFIG.cutins.early), true); W.cutinCd = 3; }
      enterStage(W.stage === 'p1' ? 'p2' : 'bossIntro');
    }
  }
  if (W.stage === 'p1' || W.stage === 'p2') { W.spawnT -= dt * ts; if (W.spawnT <= 0) { spawnWave(); W.spawnT = spawnInterval(); } }
  if (W.stage === 'p1' || W.stage === 'p2' || W.stage === 'boss') {
    W.cashT -= dt; if (W.cashT <= 0) { spawnAmbientCash(); W.cashT = 3.2; }
    W.supplyT -= dt;
    if (W.supplyT <= 0 && W.drops.filter(d => d.kind === 'weapon').length < 2) { supplyDrop(); W.supplyT = W.stage === 'boss' ? 15 : 18; }
  }
  if (W.stage === 'bossIntro') updateBossIntro();
  if (W.stage === 'bossDeath' && W.stageT > 1.2) enterStage('victory');
  if (W.stage === 'victory') updateVictory(dt);
}

/* =====================================================================
 * §9 Boss：巧馨
 * ===================================================================== */
const BOSS_LAND_Y = 380;
const BOSS_ATKS = { 1: ['ring', 'aimed'], 2: ['ring', 'aimed', 'cake', 'summon'], 3: ['spiral', 'aimed', 'cakeRain', 'ring', 'summon'] };
function makeBoss() {
  const hp = W.diff.bossHp;
  return { x: WORLD_W / 2, y: -220, r: 46, hp, maxHp: hp, stage: 1, flash: 0, invuln: 0, active: false, atk: null, st: 1.5, last: '',
    face: 1, hitCd: 0, bubble: null, bubbleT: 0, landed: false, party: false };
}
function updateBossIntro() {
  const b = W.boss, t = W.stageT;
  if (t < 1.4) { const u = t / 1.4; b.y = lerp(-220, BOSS_LAND_Y, u * u); }
  else if (!b.landed) {
    b.landed = true; b.y = BOSS_LAND_Y;
    W.shake = 18; Snd.play('cakeSlam'); Snd.play('roar');
    burst(b.x, b.y + 40, 30, { cols: ['#e2b87c', '#c08a52', '#fff3b0'], size: 6, up: 80 });
    banner('巧馨 已加入群組', '11/29 壽星・爆氣中', 2);
    b.bubble = CONFIG.taunts.boss[0]; b.bubbleT = 2;
    pushOut(P, b.x, b.y, b.r + 60);
  }
  if (t > 3.4) enterStage('boss');
}
function damageBoss(dmg) {
  const b = W.boss;
  if (b.invuln > 0) { burst(b.x, b.y, 2, { cols: ['#ffd23f'], size: 3, grav: 0, life: 0.2 }); return; }
  b.hp -= dmg; b.flash = 0.08; Snd.play('hit');
  const ratio = b.hp / b.maxHp;
  if (b.hp <= 0) { bossDie(); return; }
  if (ratio <= 1 / 3 && b.stage < 3) setBossStage(3);
  else if (ratio <= 2 / 3 && b.stage < 2) setBossStage(2);
}
/* 巧馨第二階段：召喚丁丁、拉拉、小波 */
function summonTubbies() {
  const b = W.boss; b.summoned = true;
  ['tinky', 'laa', 'po'].forEach((k, i) => {
    let x = b.x + [-150, 0, 150][i], y = b.y + [60, 150, 60][i];
    if (Arena.solidAt(x, y)) { x = b.x; y = b.y + 100; }
    spawnEnemy(k, x, y);
    burst(x, y - 30, 24, { cols: [TUBBIES[k].ramp[2], TUBBIES[k].ramp[4], '#ffffff'], size: 6, up: 160 });
  });
  banner('天線寶寶來了！', '丁丁・拉拉・小波 加入排擠！', 2.4);
  cutin(CONFIG.cutins.tubbies, true);
  Snd.play('phase');
}
function setBossStage(n) {
  const b = W.boss;
  b.stage = n; b.invuln = 1; b.atk = null; b.st = 1.2;
  clearEnemyBullets();
  b.bubble = n === 3 ? CONFIG.taunts.boss[1] : CONFIG.taunts.boss[2]; b.bubbleT = 2;
  Snd.play('roar'); W.shake = 12;
  if (n === 3) { banner('巧馨 爆氣了！', '螺旋彈幕＋蛋糕雨來襲', 2); cutin(CONFIG.cutins.rage, true, true); }
  if (n >= 2 && !W.boss.summoned) summonTubbies();
}
function bossDie() {
  const b = W.boss;
  b.hp = 0; b.active = false; b.atk = null;
  W.clearTime = W.time; W.flashT = 0.6; W.shake = 20;
  clearEnemyBullets(); W.cakes.length = 0; W.timeStop = 0;
  for (const e of W.enemies) killEnemy(e, true);
  W.enemies.length = 0;
  P.invuln = 999;
  burst(b.x, b.y, 50, { up: 200, size: 7 });
  Snd.play('roar');
  enterStage('bossDeath');
}
function dropCake(x, y) {
  x = clamp(x, TILE * 1.5, WORLD_W - TILE * 1.5); y = clamp(y, TILE * 1.5, WORLD_H - TILE * 1.5);
  W.cakes.push({ x, y, r: 110, t: 1.2, landed: false, life: 4, alive: true });
}
function updateCakes(cdt) {
  if (cdt <= 0) return;
  for (const k of W.cakes) {
    if (!k.landed) {
      k.t -= cdt;
      if (k.t <= 0) {
        k.landed = true; Snd.play('cakeSlam'); W.shake = Math.max(W.shake, 14);
        burst(k.x, k.y, 24, { cols: ['#ffffff', '#ff8fc0', '#f3c27a', '#e8213f'], size: 6, up: 150 });
        if (!P.dead && Math.hypot(P.x - k.x, P.y - k.y) < k.r) hurtPlayer(25);
        const t0x = Math.floor((k.x - k.r) / TILE), t1x = Math.floor((k.x + k.r) / TILE), t0y = Math.floor((k.y - k.r) / TILE), t1y = Math.floor((k.y + k.r) / TILE);
        for (let ty = t0y; ty <= t1y; ty++) for (let tx = t0x; tx <= t1x; tx++)
          if (Arena.type(tx, ty) === T_CRATE && Math.hypot((tx + 0.5) * TILE - k.x, (ty + 0.5) * TILE - k.y) < k.r && Arena.hitCrate(tx, ty, 999)) crateBroken(tx, ty);
        pushOut(P, k.x, k.y, 40); W.enemies.forEach(e => pushOut(e, k.x, k.y, 40));
      }
    } else { k.life -= cdt; if (k.life <= 0) k.alive = false; }
  }
  compact(W.cakes);
}
function updateBoss(bdt, dt) {
  const b = W.boss;
  b.flash -= dt; b.invuln -= dt; b.bubbleT -= dt; if (b.bubbleT <= 0) b.bubble = null;
  if (!b.active || bdt <= 0) return;
  b.hitCd -= bdt;
  const dx = P.x - b.x, dy = P.y - b.y, dist = Math.hypot(dx, dy) || 1;
  const sp = 60 * (b.stage === 3 ? 1.3 : 1);
  let vx, vy;
  if (dist > 320 || !Arena.los(b.x, b.y, P.x, P.y)) [vx, vy] = steer(b, P); else if (dist < 200) { vx = -dx / dist; vy = -dy / dist; } else { vx = -dy / dist * 0.6; vy = dx / dist * 0.6; }
  moveCircle(b, vx * sp * bdt, vy * sp * bdt);
  b.face = dx >= 0 ? 1 : -1;
  if (!P.dead && dist < b.r + P.r && b.hitCd <= 0) { hurtPlayer(15); b.hitCd = 0.8; }
  if (!b.atk) { b.st -= bdt; if (b.st <= 0) startAttack(b); }
  else runAttack(b, bdt);
}
function startAttack(b) {
  const pool = BOSS_ATKS[b.stage].filter(a => a !== b.last), name = pick(pool);
  b.last = name; b.atk = { name, t: 0, n: 0, k: 0 };
  if (name === 'cake' || name === 'cakeRain') Snd.play('cakeWarn');
}
function endAttack(b) { b.atk = null; b.st = [0, 1.4, 1.1, 0.8][b.stage]; }
function runAttack(b, bdt) {
  const a = b.atk; a.t += bdt;
  const toP = Math.atan2(P.y - 16 - b.y, P.x - b.x);
  switch (a.name) {
    case 'ring':
      if (a.t >= 0.5 && a.n === 0) {
        a.n = 1; const N = b.stage === 3 ? 24 : 16, off = Math.random() * 6;
        for (let i = 0; i < N; i++) shoot('enemy', b.x, b.y, off + i / N * Math.PI * 2, { speed: 200, dmg: 10, r: 9 });
        Snd.play('bossShot');
      }
      if (a.t > 0.8) endAttack(b); break;
    case 'aimed':
      if (a.n < 3 && a.t >= 0.3 + a.n * 0.3) { a.n++; for (let i = -2; i <= 2; i++) shoot('enemy', b.x, b.y, toP + i * 0.17, { speed: 280, dmg: 10, r: 9 }); Snd.play('bossShot'); }
      if (a.n >= 3 && a.t > 1.3) endAttack(b); break;
    case 'cake':
      if (a.n === 0) { a.n = 1; dropCake(P.x, P.y); }
      if (a.t > 0.9) endAttack(b); break;
    case 'cakeRain':
      if (a.n === 0) { a.n = 1; dropCake(P.x, P.y); for (let i = 0; i < 2; i++) { const an = Math.random() * 6.28, r = 120 + Math.random() * 140; dropCake(P.x + Math.cos(an) * r, P.y + Math.sin(an) * r); } }
      if (a.t > 1.2) endAttack(b); break;
    case 'summon':
      if (a.n === 0) {
        a.n = 1;
        if (W.enemies.length < 14) for (let i = 0; i < 4; i++) { const an = i / 4 * Math.PI * 2 + 0.4; spawnEnemy('mob', b.x + Math.cos(an) * 95, b.y + Math.sin(an) * 95); }
        b.bubble = '全體@'; b.bubbleT = 1.5;
      }
      if (a.t > 1) endAttack(b); break;
    case 'spiral': {
      a.k += bdt; const arms = b.stage === 3 ? 3 : 2;
      while (a.k >= 0.09) { a.k -= 0.09; a.n += 0.33; for (let i = 0; i < arms; i++) shoot('enemy', b.x, b.y, a.n + i / arms * Math.PI * 2, { speed: 190, dmg: 8, r: 9 }); }
      if (a.t > 4) endAttack(b); break;
    }
  }
}

/* ---------- 勝利：跨日慶生 ---------- */
function setupVictory() {
  W.bullets.length = 0; W.cakes.length = 0; W.enemies.length = 0; W.timeStop = 0;
  W.party = []; W.vBell = 0; W.songStarted = false; P.invuln = 999;
  if (W.boss) W.boss.party = true;
}
function spawnParty() {
  const keys = ['mob_green', 'mob_blue', 'mob_orange', 'shooter', 'charger', 'chaser'];
  for (let i = 0; i < 16; i++) {
    for (let tries = 0; tries < 8; tries++) {
      const a = i / 16 * Math.PI * 2 + tries * 0.3, r = 200 + Math.random() * 130, x = P.x + Math.cos(a) * r, y = P.y + Math.sin(a) * r;
      if (x < 80 || y < 80 || x > WORLD_W - 80 || y > WORLD_H - 80 || Arena.solidAt(x, y)) continue;
      W.party.push({ x, y, sprite: pick(keys), skin: pick(Object.values(NPC_SKINS).flat()), ph: Math.random() * 6, face: x < P.x ? 1 : -1 });
      burst(x, y - 30, 10, { up: 150 });

    }
  }
}
function updateVictory(dt) {
  const t = W.stageT;
  if (t > 1.2 && W.vBell < 12 && t > 1.2 + W.vBell * 0.22) { W.vBell++; Snd.play('bell'); }
  if (t > 1.2 && !W.party.length) { spawnParty(); W.shake = 6; }
  if (t > 1.2 && Math.random() < dt * 5) burst(P.x + (Math.random() - 0.5) * 700, P.y - 150 + (Math.random() - 0.5) * 300, 18, { up: 220, speed: 260, life: 1.2 });
  if (t > 5.4) goEnding();
}
function goEnding() {
  const key = 'best_' + W.diffKey, best = Store.get(key, null);
  const valid = W.clearTime > 1, isBest = valid && (best === null || best <= 1 || W.clearTime < best);
  if (isBest) Store.set(key, W.clearTime);
  Music.stop();
  Game.setState('ENDING', { time: W.clearTime, best: isBest ? W.clearTime : best, isBest, diff: W.diffKey });
  P.invuln = 0;

const Game = {

const clickables = [];
function hit(x, y) { for (let i = clickables.length - 1; i >= 0; i--) { const b = clickables[i]; if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b; } return null; }

}

Game.states.PLAY = {

    else if (c === 'Space' || c === 'Enter') { if (!this.skipTap() && c === 'Space') Input.skillTap = 'bomb'; }

    else if (c === 'Digit2' || c === 'Numpad2') Input.skillTap = 'giant';

/* =====================================================================
 * 破關動畫：夜空煙火 → 蛋糕升起 → 兩位壽星走到蛋糕兩側 → 派對帽落下
 *          → 同時打出「11/28 迪西生日快樂」「11/29 巧馨生日快樂」兩條緞帶 → 成績與再玩一次
 * ===================================================================== */
Game.states.ENDING = {
  enter(p) {
    this.p = p; this.t = 0; this.parts = []; this.fw = []; this.fwT = 0;
    this.stars = Array.from({ length: 80 }, () => [Math.random(), Math.random() * 0.62, Math.random() * 6]);
    Music.stop();
    setTimeout(() => { if (Game.stateName === 'ENDING') Music.birthday(); }, 600);
  },
  update(dt) {
    this.t += dt;
    const w = view.w, h = view.h;
    if (this.t > 2.3 && this.parts.length < 170 && Math.random() < 0.85)
      this.parts.push({ x: Math.random() * w, y: -10, vy: 50 + Math.random() * 70, ph: Math.random() * 6, col: pick(CONFETTI) });
    for (const p of this.parts) p.y += p.vy * dt;
    this.parts = this.parts.filter(p => p.y < h + 10);
    this.fwT -= dt;
    if (this.t > 2.2 && this.fwT <= 0) {
      this.fwT = 0.45 + Math.random() * 0.45;
      const cx = w * (0.12 + Math.random() * 0.76), cy = h * (0.08 + Math.random() * 0.3), col = pick(CONFETTI);
      for (let i = 0; i < 40; i++) { const a = i / 40 * Math.PI * 2, sp = 80 + Math.random() * 70; this.fw.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1.3, col }); }
      Snd.play('pop');
    }
    for (const f of this.fw) { f.life -= dt; f.vy += 70 * dt; f.vx *= 0.985; f.vy *= 0.985; f.x += f.vx * dt; f.y += f.vy * dt; }
    this.fw = this.fw.filter(f => f.life > 0);
  },
  render() {
    clickables.length = 0;
    const w = view.w, h = view.h, t = this.t, portrait = h > w, short = h < 450, S = Safe;
    // 夜空與星星
    const sky = ctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, '#120a28'); sky.addColorStop(0.55, '#3a1e4a'); sky.addColorStop(1, '#7a3e3a');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, w, h);
    for (const [sx, sy, ph] of this.stars) { ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(t * 2 + ph)); ctx.fillStyle = '#fff'; ctx.fillRect(sx * w, sy * h, 2, 2); }
    ctx.globalAlpha = 1;
    for (const f of this.fw) { ctx.globalAlpha = Math.min(1, f.life * 1.4); ctx.fillStyle = f.col; ctx.fillRect(f.x - 2, f.y - 2, 4, 4); }
    ctx.globalAlpha = 1;
    // 地面
    const groundY = Math.round(h * (portrait ? 0.64 : short ? 0.74 : 0.7));
    for (let x = 0; x < w; x += 64) for (let y = groundY; y < h; y += 64) ctx.drawImage(Tiles.get('ground', (((x / 64) | 0) * 3 + ((y / 64) | 0)) % 8 * 2), x, y, 64, 64);
    ctx.fillStyle = 'rgba(30,14,40,0.35)'; ctx.fillRect(0, groundY, w, h - groundY);
    // 蛋糕升起 + 蠟燭火光
    const cs = portrait ? 3 : short ? 2.4 : 3.6, cz = Sprites.size('cake');
    const rise = clamp((t - 0.3) / 0.8, 0, 1), cakeX = Math.round(w / 2 - cz.w * cs / 2), cakeY = groundY + 12 - cz.h * cs + (1 - rise) * (h - groundY + cz.h * cs);
    Sprites.draw(ctx, 'cake', cakeX, cakeY, cs);
    if (rise >= 1) for (const cx of [17, 23, 29]) {
      const fr = 1 + 0.25 * Math.sin(t * 20 + cx);
      ctx.fillStyle = 'rgba(255,220,120,0.35)'; ctx.beginPath(); ctx.arc(cakeX + cx * cs, cakeY + 1 * cs, 7 * cs * fr, 0, Math.PI * 2); ctx.fill();
    }
    // 兩位壽星走到蛋糕兩側
    const s = portrait ? Math.min(1.6, (w - cz.w * cs - 40) / (46 + 64)) : short ? 1.15 : 1.8;
    const hz = Sprites.size('hero_0'), bz = Sprites.size('boss');
    const walk = clamp((t - 0.6) / 1.4, 0, 1), ease = 1 - Math.pow(1 - walk, 2);
    const hxT = cakeX - hz.w * s - 4, bxT = cakeX + cz.w * cs + 4;
    const hx = lerp(-hz.w * s - 30, hxT, ease), bx = lerp(w + 30, bxT, ease);
    const jh = t > 2.2 ? Math.abs(Math.sin(t * 5)) * 14 : 0, jb = t > 2.2 ? Math.abs(Math.sin(t * 5 + 1.3)) * 14 : 0;
    const hy = groundY + 8 - hz.h * s - jh, by = groundY + 8 - bz.h * s - jb;
    shadowAt(hx + hz.w * s / 2, groundY + 6, 22 * s); shadowAt(bx + bz.w * s / 2, groundY + 6, 30 * s);
    Sprites.draw(ctx, 'hero_' + (walk < 1 ? 1 + (Math.floor(t * 8) % 2) : 0), hx, hy, s);
    const ac = [bx + BOSS_CENTER[0] * s, by + BOSS_CENTER[1] * s];
    FX.bossAura(ctx, ac[0], ac[1], s * BOSS_AURA, t, false, 'back');
    Sprites.draw(ctx, 'boss', bx, by, s);
    FX.bossAura(ctx, ac[0], ac[1], s * BOSS_AURA, t, false, 'front');
    if (t > 2.0) { const d = 1 - clamp((t - 2.0) / 0.3, 0, 1); drawHat(ctx, 'hero', hx, hy - d * 90, s); drawHat(ctx, 'boss', bx, by - d * 90, s); }
    // 大標題 + 兩條同時出現的生日緞帶
    if (t > 2.3) {
      const k = clamp((t - 2.3) / 0.35, 0, 1), pop = k * (1 + Math.sin(k * Math.PI) * 0.25);
      ctx.save(); ctx.translate(w / 2, S.t + (portrait ? 64 : short ? 30 : 48)); ctx.scale(pop, pop);
      drawOutlinedText('🎉 生日快樂！🎉', 0, 0, portrait ? 32 : short ? 28 : 44, '#ffd23f');
      ctx.restore();
      const rw = Math.min(w - 24, portrait ? 370 : 560), rh = portrait ? 56 : short ? 40 : 62;
      const y1 = S.t + (portrait ? 92 : short ? 52 : 86), y2 = y1 + rh + (short ? 8 : 12);
      const ribbon = (y, col, dark, fromLeft, big, small) => {
        const kk = clamp((t - 2.55) / 0.45, 0, 1), e2 = 1 - Math.pow(1 - kk, 3);
        const x = w / 2 - rw / 2 + (fromLeft ? -1 : 1) * (1 - e2) * (w + rw);
        const notch = rh * 0.35;
        ctx.fillStyle = dark;
        ctx.beginPath(); ctx.moveTo(x - 14, y + 8); ctx.lineTo(x + 20, y + 8); ctx.lineTo(x + 20, y + rh + 8); ctx.lineTo(x - 14, y + rh + 8); ctx.lineTo(x - 14 + notch, y + rh / 2 + 8); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(x + rw + 14, y + 8); ctx.lineTo(x + rw - 20, y + 8); ctx.lineTo(x + rw - 20, y + rh + 8); ctx.lineTo(x + rw + 14, y + rh + 8); ctx.lineTo(x + rw + 14 - notch, y + rh / 2 + 8); ctx.closePath(); ctx.fill();
        ctx.fillStyle = OUTLINE; ctx.fillRect(x - 3, y - 3, rw + 6, rh + 6);
        ctx.fillStyle = col; ctx.fillRect(x, y, rw, rh);
        ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(x, y, rw, 4);
        ctx.fillStyle = 'rgba(255,255,255,0.18)'; for (let i = 0; i < 6; i++) ctx.fillRect(x + 10 + i * (rw - 20) / 5 - 2, y + rh - 8, 4, 4);
        drawOutlinedText(big, x + rw / 2, y + rh / 2 - (small ? 6 : 0), portrait ? 21 : short ? 17 : 26, '#fff');
        if (small && !short) drawOutlinedText(small, x + rw / 2, y + rh / 2 + 15, 11, '#fff3b0');
      };
      ribbon(y1, '#2f9a3a', '#1e6a24', true, `🎂 ${CONFIG.names.heroBday} ${CONFIG.names.hero} 生日快樂！`, '偷走跨日神鐘的壽星');
      ribbon(y2, '#d0405a', '#9a2a3e', false, `🎂 ${CONFIG.names.bossBday} ${CONFIG.names.boss} 生日快樂！`, '終於等到 00:00:00 的壽星');
      // 名牌
      drawOutlinedText(`${CONFIG.names.hero} ${CONFIG.names.heroBday}`, hx + hz.w * s / 2, groundY + 24, 14, '#9ee06a');
      drawOutlinedText(`${CONFIG.names.boss} ${CONFIG.names.bossBday}`, bx + bz.w * s / 2, groundY + 24, 14, '#ff9a8a');
    }
    // 彩帶
    for (const p of this.parts) { ctx.save(); ctx.translate(p.x + Math.sin(t * 3 + p.ph) * 8, p.y); ctx.rotate(t * 4 + p.ph); ctx.fillStyle = p.col; ctx.fillRect(-4, -2.5, 8, 5); ctx.restore(); }
    // 成績與按鈕
    if (t > 4.2) {
      const a = clamp((t - 4.2) / 0.5, 0, 1);
      ctx.globalAlpha = a;
      const my = short ? h - S.b - 64 : groundY + (portrait ? 64 : 58);
      if (!short) drawOutlinedText(CONFIG.endingMessage, w / 2, my, portrait ? 18 : 22, '#fff');
      const diffLabel = CONFIG.difficulty[this.p.diff].label;
      drawOutlinedText(this.p.preview ? '🎬 精彩大結局預覽・打倒巧馨就能看到！' : `${diffLabel}・通關 ${fmtTime(this.p.time)}${this.p.isBest ? '・新紀錄！' : this.p.best > 1 ? `・最佳 ${fmtTime(this.p.best)}` : ''}`, w / 2, my + (short ? 0 : 30), 13, '#ffd23f');
      const bw = Math.min(240, w * 0.6);
      menuButton(w / 2 - bw / 2, Math.min(h - S.b - 62, my + (short ? 14 : 52)), bw, 48, this.p.preview ? '🏠 回到首頁' : '🎉 再玩一次', '#e8742a', () => Game.setState('TITLE'));
      ctx.globalAlpha = 1;
    } else if (t > 1) drawOutlinedText('點一下跳過 ▶', w - S.r - 60, h - S.b - 20, 12, 'rgba(255,255,255,0.7)');
    if (t < 0.8) { ctx.fillStyle = `rgba(255,255,255,${1 - t / 0.8})`; ctx.fillRect(0, 0, w, h); }
    menuButton(S.l + 12, S.t + 8, 84, 30, '🏠 首頁', '#6a4a32', () => Game.setState('TITLE'));
  },
  tap(x, y) { const b = hit(x, y); if (b && (this.t >= 4.2 || b === clickables[clickables.length - 1])) { b.onTap(); return; } if (this.t < 4.2) this.t = 4.2; },
  key(c) { if (c === 'Enter') { if (this.t < 4.2) this.t = 4.2; else Game.setState('TITLE'); } },
};

/* =====================================================================
 * §12 Main —— resize、固定步長主迴圈
 * ===================================================================== */
function resize() {
  view.dpr = Math.min(window.devicePixelRatio || 1, 2);
  view.w = window.innerWidth; view.h = window.innerHeight;
  canvas.width = Math.round(view.w * view.dpr); canvas.height = Math.round(view.h * view.dpr);
  canvas.style.width = view.w + 'px'; canvas.style.height = view.h + 'px';
  measureSafe();
  Input.layout();
}

const STEP = 1 / 60;
let acc = 0, last = 0, lowFpsT = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000 || 0); last = now;
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 6) { Game.t += STEP; if (Game.state.update) Game.state.update(STEP); acc -= STEP; n++; }
  if (n >= 6) acc = 0;
  if (W && dt > 0) { lowFpsT = dt > 1 / 40 ? lowFpsT + dt : Math.max(0, lowFpsT - dt); if (lowFpsT > 2) W.lowFx = true; }
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, view.w, view.h);
  Game.state.render();
  if (PARAMS.debug) { ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0); ctx.font = UI.font(12); ctx.fillStyle = '#0f0'; ctx.textBaseline = 'top'; ctx.fillText(`${Game.stateName} ${Math.round(1 / Math.max(dt, 1e-3))}fps`, 6, view.h - 34); }
  requestAnimationFrame(frame);
}

function startGame() {
  document.body.classList.add('game');
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  Input.init();
  ['touchstart', 'touchmove', 'touchend', 'gesturestart'].forEach(n => document.addEventListener(n, e => e.preventDefault(), { passive: false }));
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (Game.stateName === 'PLAY' && W && !W.overlay) { W.overlay = 'pause'; Input.reset(); }
      Snd.pause();
    } else if (!(Game.stateName === 'PLAY' && W && W.overlay === 'pause')) Snd.resume();
  });
  Game.setState('BOOT');
  requestAnimationFrame(t => { last = t; frame(t); });
}
